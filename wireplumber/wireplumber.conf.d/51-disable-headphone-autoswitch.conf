# ~/.config/wireplumber/wireplumber.conf.d/51-disable-headphone-autoswitch.conf
# Propósito: Evita que PipeWire/WirePlumber cambie automáticamente a audífonos
# o silencie la salida de altavoces (Line-Out) en la tarjeta Realtek ALC897.

wireplumber.settings = {
  # Desactiva el cambio automático de puerto al conectar/desconectar jack
  linking.follow-default-target = true
}

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = false
        api.acp.auto-port = false
      }
    }
  }
]
